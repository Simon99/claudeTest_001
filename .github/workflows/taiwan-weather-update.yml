name: Update Taiwan Weather Forecast

on:
  schedule:
    # Run every day at 6:00 AM UTC (2:00 PM Taiwan time)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - feature/taiwan-weather-forecast

jobs:
  update-weather:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Fetch weather data and generate HTML
      env:
        OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      run: python fetch_weather.py
      
    - name: Commit and push if changed
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add taiwan-weather-forecast.html
        git diff --staged --quiet || (git commit -m "Update weather forecast - $(date +'%Y-%m-%d %H:%M')" && git push)